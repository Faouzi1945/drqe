
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DREQ — Espace étudiant</title>
<style>
:root{--g:#087f66;--bg:#f4faf7;--txt:#183b32}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--txt)}
header{background:white;padding:18px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e0eee7}
.logo{font-size:27px;font-weight:800;color:var(--g)}
main{max-width:560px;margin:45px auto;padding:0 16px}
.card{background:white;border:1px solid #e2eee8;border-radius:18px;padding:25px;box-shadow:0 8px 30px #12352d0b}
h1{font-size:27px;margin-top:0}
p{line-height:1.6;color:#61736c}
label{display:block;margin:15px 0 7px;font-weight:bold;font-size:14px}
input{width:100%;padding:13px;border:1px solid #d6e5dd;border-radius:9px;font-size:16px}
button{border:0;border-radius:10px;padding:13px 17px;background:var(--g);color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.secondary{background:#e9f7f1;color:var(--g)}
.msg{padding:12px;border-radius:9px;background:#edf8f2;margin-top:15px;white-space:pre-wrap}
.hidden{display:none!important}
.student{padding:14px 0;border-bottom:1px solid #e5eee9;overflow-wrap:anywhere}
small{color:#61736c}
</style>
</head>
<body>
<header>
  <div class="logo">DR<span style="color:#183b32">EQ</span></div>
  <button id="logout" class="hidden">Déconnexion</button>
</header>

<main>
  <section class="card" id="auth">
    <h1>Bienvenue sur DREQ</h1>
    <p>Connecte-toi à ton espace de révision médicale.</p>

    <div id="signupFields" class="hidden">
      <label for="name">Nom complet</label>
      <input id="name" autocomplete="name" placeholder="Ton nom complet">
    </div>

    <label for="email">Adresse e-mail</label>
    <input id="email" type="email" autocomplete="email" placeholder="nom@exemple.com">

    <label for="password">Mot de passe</label>
    <input id="password" type="password" autocomplete="current-password" minlength="8" placeholder="8 caractères minimum">

    <div class="actions">
      <button id="loginBtn">Se connecter</button>
      <button id="signupBtn" class="secondary">Créer un compte</button>
    </div>
    <div id="authMsg" class="msg hidden" role="status"></div>
  </section>

  <section class="card hidden" id="studentArea">
    <h1 id="welcome">Mon espace DREQ</h1>
    <div id="studentMsg" class="msg">Vérification de ton accès...</div>
    <div id="adminArea" class="hidden">
      <h2>Administration</h2>
      <p>Active ou désactive l'accès des étudiants après vérification de leur paiement en dehors de l'application.</p>
      <button id="refreshStudents" class="secondary">Actualiser les comptes</button>
      <div id="students"></div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://yzifxfasvhjgskjsqcdx.supabase.co";
const SUPABASE_KEY = "sb_publishable_gg77GJP7dCZQJKYjpJfkNg_50YOqD6H";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
let currentProfile = null;

function message(id, text) {
  $(id).textContent = text;
  $(id).classList.remove("hidden");
}
function hide(id) { $(id).classList.add("hidden"); }

function showSignup(show) {
  $("signupFields").classList.toggle("hidden", !show);
  $("loginBtn").classList.toggle("hidden", show);
  $("signupBtn").classList.toggle("hidden", show);
  if (show) {
    const back = document.createElement("button");
    back.textContent = "Retour à la connexion";
    back.className = "secondary";
    back.id = "backBtn";
    back.onclick = () => {
      back.remove();
      showSignup(false);
    };
    if (!$("backBtn")) $("auth").querySelector(".actions").appendChild(back);
  } else {
    $("backBtn")?.remove();
  }
}

$("signupBtn").onclick = async () => {
  showSignup(true);
  $("signupBtn").classList.add("hidden");
  $("loginBtn").classList.add("hidden");

  if ($("createBtn")) return;
  const btn = document.createElement("button");
  btn.id = "createBtn";
  btn.textContent = "Créer mon compte";
  btn.onclick = createAccount;
  $("auth").querySelector(".actions").prepend(btn);
};

async function createAccount() {
  const name = $("name").value.trim();
  const email = $("email").value.trim();
  const password = $("password").value;

  if (!name || !email || password.length < 8) {
    message("authMsg", "Entre ton nom, un e-mail valide et un mot de passe de 8 caractères minimum.");
    return;
  }

  $("createBtn").disabled = true;
  try {
    const { data, error } = await db.auth.signUp({
      email, password, options: { data: { full_name: name } }
    });
    if (error) throw error;

    if (data.session) {
      await loadSession();
    } else {
      message("authMsg", "Compte créé. Vérifie ta boîte e-mail si une confirmation est demandée, puis connecte-toi. Ton accès sera en attente de validation par l'administration.");
    }
  } catch (e) {
    message("authMsg", "Erreur : " + e.message);
  } finally {
    $("createBtn").disabled = false;
  }
}

$("loginBtn").onclick = async () => {
  const email = $("email").value.trim();
  const password = $("password").value;
  if (!email || !password) {
    message("authMsg", "Entre ton e-mail et ton mot de passe.");
    return;
  }
  $("loginBtn").disabled = true;
  try {
    const { error } = await db.auth.signInWithPassword({ email, password });
    if (error) throw error;
    await loadSession();
  } catch (e) {
    message("authMsg", "Connexion impossible : " + e.message);
  } finally {
    $("loginBtn").disabled = false;
  }
};

async function loadSession() {
  const { data: { user } } = await db.auth.getUser();
  if (!user) return;

  hide("auth");
  $("studentArea").classList.remove("hidden");
  $("logout").classList.remove("hidden");
  $("welcome").textContent = "Bienvenue sur DREQ";

  const { data: profile, error } = await db
    .from("profiles")
    .select("id,email,role,access_active")
    .eq("id", user.id)
    .single();

  if (error || !profile) {
    message("studentMsg", "Erreur profil : " + (error ? error.message : "Aucun profil trouvé pour cet utilisateur."));
    return;
  }

  currentProfile = profile;

  if (profile.role === "admin") {
    $("adminArea").classList.remove("hidden");
    message("studentMsg", "Connecté en tant qu'administrateur.");
    await loadStudents();
  } else if (profile.access_active) {
    message("studentMsg", "Ton accès est activé. L'espace de révision sera disponible au fur et à mesure de l'installation des fonctionnalités.");
  } else {
    message("studentMsg", "Ton compte est créé, mais ton accès est en attente de validation. Contacte l'administration DREQ après l'envoi de ton reçu par WhatsApp.");
  }
}

async function loadStudents() {
  $("students").textContent = "Chargement...";
  const { data, error } = await db
    .from("profiles")
    .select("id,email,role,access_active")
    .order("email");

  if (error) {
    $("students").textContent = "Impossible de charger les comptes : " + error.message;
    return;
  }

  $("students").replaceChildren();
  data.forEach(profile => {
    if (profile.role === "admin") return;

    const item = document.createElement("div");
    item.className = "student";

    const title = document.createElement("strong");
    title.textContent = profile.email || "Étudiant";
    const status = document.createElement("p");
    status.textContent = profile.access_active ? "Accès activé" : "En attente";
    const btn = document.createElement("button");
    btn.textContent = profile.access_active ? "Désactiver l'accès" : "Activer l'accès";
    btn.className = profile.access_active ? "secondary" : "";
    btn.onclick = async () => {
      btn.disabled = true;
      const { error: updateError } = await db
        .from("profiles")
        .update({ access_active: !profile.access_active })
        .eq("id", profile.id);

      if (updateError) {
        alert("Modification impossible : " + updateError.message);
        btn.disabled = false;
        return;
      }
      await loadStudents();
    };

    item.append(title, status, btn);
    $("students").appendChild(item);
  });
}

$("refreshStudents").onclick = loadStudents;

$("logout").onclick = async () => {
  await db.auth.signOut();
  location.reload();
};

db.auth.onAuthStateChange((event) => {
  if (event === "SIGNED_IN") {
    setTimeout(loadSession, 0);
  }
});

loadSession();
</script>
</body>
</html>
